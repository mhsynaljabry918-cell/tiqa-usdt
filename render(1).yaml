services:
  - type: web
    name: tiqa-usdt-api
    runtime: node
    plan: free
    buildCommand: unzip -o TiqaUSDT-Render-App.zip -d app && cd app && npm install && npm run db:migrate
    startCommand: cd app && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: OTP_DELIVERY_MODE
        value: console
      - key: ALLOW_INSECURE_OTP_LOGS
        value: "true"
      - key: OTP_MINUTES
        value: "10"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: SESSION_DAYS
        value: "14"
      - key: DATABASE_URL
        sync: false
      - key: OTP_PEPPER
        generateValue: true
